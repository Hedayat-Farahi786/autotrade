[project]
name = "gtmo-xauusd-bot"
version = "1.0.0"
description = "GTMO VIP XAUUSD Telegram → MT5 automated trading bot"
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["web/static"]

[tool.ruff.lint]
# Sensible, non-pedantic defaults: errors, pyflakes, isort, bugbear, comprehensions.
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = [
    "E501",   # line length handled by formatter / not enforced hard
    "B008",   # function calls in arg defaults (FastAPI/dataclass patterns)
    "B904",   # raise ... from — not required here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true   # MetaTrader5 / telethon / SDKs are untyped
warn_unused_ignores = false
check_untyped_defs = false
exclude = ["web/static", "build/"]
