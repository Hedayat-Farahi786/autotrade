name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # MetaTrader5 is Windows-only and skipped on Linux via the platform
          # marker; telethon is heavy and not needed for the test suite.
          pip install python-dotenv pytest pytest-asyncio ruff mypy

      - name: Lint (ruff)
        run: ruff check bot tests main.py

      - name: Type-check (mypy)
        run: mypy bot || true   # advisory; untyped 3rd-party libs

      - name: Run tests
        run: pytest -q
